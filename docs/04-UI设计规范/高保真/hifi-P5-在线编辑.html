<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>高保真 P5 在线编辑页 · myMemory</title>
<style>
:root{
  --primary:#96604B; --primary-hover:#8A5A45; --primary-active:#7A4B3B;
  --primary-soft:#E8D5C6; --accent:#B4785A;
  --text:#3D332C; --muted:#6E5F54; --border:#E3D8CC;
  --bg:#FDFAF5; --bg-subtle:#F7F1E8; --bg-hover:#EFE4D6;
  --link:#8A5A45; --link-hover:#7A4E3C;
  --success:#7D8C4F; --warning:#B07C22; --danger:#A85A4D;
  --warn-bg:#F5E9D2; --warn-fg:#7A5A1E;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --shadow:0 1px 2px rgba(61,51,44,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-subtle); color:var(--text);
  font-family:-apple-system,"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:18px; line-height:1.8; -webkit-font-smoothing:antialiased;
}
.shell{min-height:960px;display:flex;flex-direction:column;}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);}
.topbar .inner{max-width:960px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:16px;}
.back{font-size:16px;color:var(--link);cursor:pointer;}
.ttl{font-size:18px;font-weight:600;}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--warn-fg);
  border:1px solid var(--warn-bg);background:var(--warn-bg);border-radius:999px;padding:4px 14px;font-weight:500;}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--warning);}
.content{flex:1;max-width:960px;width:100%;margin:0 auto;padding:32px 24px;}

.field{margin-bottom:28px;}
.field label{display:block;font-size:16px;font-weight:500;margin-bottom:8px;}
.input{height:56px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
  display:flex;align-items:center;padding:0 16px;font-size:18px;color:var(--text);}
.toolbar-lock{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--muted);margin-bottom:8px;}
.chip{border:1px dashed var(--border);border-radius:var(--r-sm);padding:2px 12px;color:#8A7565;font-size:16px;}
.toolbar-lock .right{margin-left:auto;}
.textarea{border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
  padding:20px;font-size:18px;line-height:2;color:var(--text);min-height:380px;}
.textarea p{margin:0 0 16px;}
.textarea p:last-child{margin-bottom:0;}

.btn{font-family:inherit;font-size:16px;font-weight:500;border-radius:var(--r-md);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;}
.btn-primary{height:56px;padding:0 32px;background:var(--primary);color:var(--bg);border:none;font-size:18px;font-weight:600;}
.btn-text{height:48px;padding:0 14px;background:none;border:none;color:var(--muted);}
.actionbar{background:var(--bg);border-top:1px solid var(--border);}
.actionbar .inner{max-width:960px;margin:0 auto;height:80px;padding:0 24px;display:flex;align-items:center;justify-content:flex-end;gap:16px;}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="inner">
      <span class="back">← 返回</span>
      <span class="ttl">编辑内容</span>
      <span class="status"><span class="dot"></span>有未保存改动</span>
    </div>
  </header>

  <main class="content">
    <div class="field">
      <label for="t">标题</label>
      <div class="input" id="t">我在南昌的童年</div>
    </div>

    <div class="field" style="margin-bottom:0">
      <label>正文</label>
      <div class="toolbar-lock">
        <span>格式工具：</span>
        <span class="chip">不提供加粗</span>
        <span class="chip">不提供列表</span>
        <span class="chip">不提供图片</span>
        <span class="right">共 1,240 字</span>
      </div>
      <div class="textarea">
        <p>1963 年的夏天，我出生在南昌老城区。那时住的是带天井的老房子，一到傍晚，邻居们便把竹床搬到巷子口乘凉。阿婆总坐在藤椅上摇着蒲扇，一边摇，一边讲她年轻时候的事。</p>
        <p>巷子口有一口老井，井栏被磨得发亮。担水的人来来往往，扁担吱呀作响。到了冬天，井口会冒白气，孩子们就围着井台跑，冻得耳朵通红也舍不得回家。</p>
        <p>我念书的小学就在巷子尽头，走路不过五分钟。课桌是木头的，上面刻满了历届学生的名字。老师用粉笔写字，写满一黑板再用湿布擦，教室里总是飘着一股粉笔灰的味道。</p>
      </div>
    </div>
  </main>

  <footer class="actionbar">
    <div class="inner">
      <button class="btn btn-text">放弃修改</button>
      <button class="btn btn-primary">保存内容</button>
    </div>
  </footer>
</div>
</body>
</html>
