<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>高保真 P1 首页 / 记录列表 · myMemory</title>
<style>
:root{
  --primary:#96604B; --primary-hover:#8A5A45; --primary-active:#7A4B3B;
  --primary-soft:#E8D5C6; --accent:#B4785A;
  --text:#3D332C; --muted:#6E5F54; --border:#E3D8CC;
  --bg:#FDFAF5; --bg-subtle:#F7F1E8; --bg-hover:#EFE4D6;
  --link:#8A5A45; --link-hover:#7A4E3C;
  --success:#7D8C4F; --warning:#B07C22; --danger:#A85A4D;
  --ok-bg:#E7EBD9; --ok-fg:#4F5C2C; --warn-bg:#F5E9D2; --warn-fg:#7A5A1E;
  --dn-bg:#F4DDD8; --dn-fg:#8F4438;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --shadow:0 1px 2px rgba(61,51,44,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-subtle); color:var(--text);
  font-family:-apple-system,"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:18px; line-height:1.8; -webkit-font-smoothing:antialiased;
}
.shell{min-height:960px;display:flex;flex-direction:column;}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);}
.topbar .inner{max-width:960px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:16px;}
.brand{font-size:20px;font-weight:700;letter-spacing:.3px;}
.brand em{font-style:normal;color:var(--primary);}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);
  border:1px solid var(--border);background:var(--bg-subtle);border-radius:999px;padding:4px 14px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
.content{flex:1;max-width:960px;width:100%;margin:0 auto;padding:32px 24px;}
h1{font-size:32px;line-height:1.4;font-weight:700;margin:0 0 8px;}
.lead{font-size:16px;color:var(--muted);margin:0 0 28px;}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);
  padding:24px;box-shadow:var(--shadow);margin-bottom:16px;}
.card-hd{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.card-ttl{font-size:24px;font-weight:700;margin:0;line-height:1.4;}
.tag{font-size:16px;line-height:1.6;border-radius:999px;padding:2px 12px;font-weight:500;}
.tag-ok{background:var(--ok-bg);color:var(--ok-fg);}
.tag-neutral{background:var(--bg-hover);color:var(--muted);}
.card-meta{font-size:16px;color:var(--muted);margin:0 0 18px;}
.card-acts{display:flex;align-items:center;gap:12px;}
.push{margin-left:auto;}
.btn{font-family:inherit;font-size:16px;font-weight:500;border-radius:var(--r-md);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;}
.btn-primary{height:56px;padding:0 32px;background:var(--primary);color:var(--bg);border:none;font-size:18px;font-weight:600;}
.btn-secondary{height:48px;padding:0 24px;background:var(--bg);color:var(--link);border:1px solid var(--border);}
.btn-text{height:48px;padding:0 14px;background:none;border:none;color:var(--muted);}
.btn-text.danger{color:var(--danger);}
.btn[disabled]{opacity:.4;cursor:default;}
.actionbar{background:var(--bg);border-top:1px solid var(--border);}
.actionbar .inner{max-width:960px;margin:0 auto;height:80px;padding:0 24px;display:flex;align-items:center;justify-content:flex-end;}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="inner">
      <span class="brand">my<em>Memory</em></span>
      <span class="status"><span class="dot"></span>服务：正常</span>
    </div>
  </header>

  <main class="content">
    <h1>我的口述记录</h1>
    <p class="lead">共 3 条记录　·　所有内容仅保存在本机浏览器中，不会自动上传</p>

    <article class="card">
      <div class="card-hd">
        <h3 class="card-ttl">我在南昌的童年</h3>
        <span class="tag tag-ok">已保存</span>
      </div>
      <p class="card-meta">更新于 2026-10-15 19:20　·　3 段录音　·　累计 04:35</p>
      <div class="card-acts">
        <button class="btn btn-secondary">继续编辑</button>
        <button class="btn btn-text">查看</button>
        <button class="btn btn-text danger">删除</button>
        <button class="btn btn-secondary push">导出文档</button>
      </div>
    </article>

    <article class="card">
      <div class="card-hd">
        <h3 class="card-ttl">在南京读书的日子</h3>
        <span class="tag tag-neutral">待转写</span>
      </div>
      <p class="card-meta">更新于 2026-10-14 21:05　·　2 段录音　·　累计 06:12</p>
      <div class="card-acts">
        <button class="btn btn-secondary">继续编辑</button>
        <button class="btn btn-text">查看</button>
        <button class="btn btn-text danger">删除</button>
        <button class="btn btn-secondary push">导出文档</button>
      </div>
    </article>

    <article class="card">
      <div class="card-hd">
        <h3 class="card-ttl">家里的老物件</h3>
        <span class="tag tag-neutral">仅录音</span>
      </div>
      <p class="card-meta">更新于 2026-10-12 15:48　·　1 段录音　·　累计 02:07</p>
      <div class="card-acts">
        <button class="btn btn-secondary">继续编辑</button>
        <button class="btn btn-text">查看</button>
        <button class="btn btn-text danger">删除</button>
        <button class="btn btn-secondary push" disabled>导出文档</button>
      </div>
    </article>
  </main>

  <footer class="actionbar">
    <div class="inner">
      <button class="btn btn-primary">新建口述记录</button>
    </div>
  </footer>
</div>
</body>
</html>
