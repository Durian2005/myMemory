<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>高保真 P3 录音页 · myMemory</title>
<style>
:root{
  --primary:#96604B; --primary-hover:#8A5A45; --primary-active:#7A4B3B;
  --primary-soft:#E8D5C6; --accent:#B4785A;
  --text:#3D332C; --muted:#6E5F54; --border:#E3D8CC;
  --bg:#FDFAF5; --bg-subtle:#F7F1E8; --bg-hover:#EFE4D6;
  --link:#8A5A45; --link-hover:#7A4E3C;
  --success:#7D8C4F; --warning:#B07C22; --danger:#A85A4D;
  --ok-bg:#E7EBD9; --ok-fg:#4F5C2C;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --shadow:0 1px 2px rgba(61,51,44,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-subtle); color:var(--text);
  font-family:-apple-system,"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:18px; line-height:1.8; -webkit-font-smoothing:antialiased;
}
.shell{min-height:960px;display:flex;flex-direction:column;}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);}
.topbar .inner{max-width:960px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:16px;}
.back{font-size:16px;color:var(--link);cursor:pointer;}
.ttl{font-size:18px;font-weight:600;}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);
  border:1px solid var(--border);background:var(--bg-subtle);border-radius:999px;padding:4px 14px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
.content{flex:1;max-width:960px;width:100%;margin:0 auto;padding:28px 24px 32px;}

.infobar{display:flex;align-items:center;gap:28px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px 24px;box-shadow:var(--shadow);margin-bottom:24px;}
.infobar .k{font-size:16px;color:var(--muted);}
.infobar .v{font-size:18px;font-weight:700;}
.infobar .sep{width:1px;height:24px;background:var(--border);}

h2{font-size:20px;line-height:1.5;font-weight:600;margin:0 0 14px;}
.seg{display:flex;align-items:center;gap:16px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 20px;margin-bottom:12px;}
.seg .n{font-size:18px;font-weight:600;}
.seg .dur{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;}
.seg .tag{font-size:16px;border-radius:999px;padding:2px 12px;background:var(--ok-bg);color:var(--ok-fg);font-weight:500;}
.seg .sp{margin-left:auto;display:flex;gap:8px;}

.recwrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:28px 24px 24px;text-align:center;margin-top:24px;}
.recbtn{width:96px;height:96px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 14px var(--primary-soft);}
.recbtn i{width:30px;height:30px;border-radius:6px;background:var(--bg);display:block;}
.recstate{font-size:20px;font-weight:600;margin-top:30px;}
.rectime{font-size:32px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:2px;}
.recsub{font-size:16px;color:var(--muted);margin-top:6px;}
.secrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px;}

.upload{text-align:center;margin-top:20px;}
.upload a{font-size:16px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;}
.upload p{font-size:16px;color:var(--muted);margin:2px 0 0;}

.btn{font-family:inherit;font-size:16px;font-weight:500;border-radius:var(--r-md);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;}
.btn-primary{height:56px;padding:0 32px;background:var(--primary);color:var(--bg);border:none;font-size:18px;font-weight:600;}
.btn-secondary{height:48px;padding:0 24px;background:var(--bg);color:var(--link);border:1px solid var(--border);}
.btn-text{height:48px;padding:0 14px;background:none;border:none;color:var(--muted);}
.btn[disabled]{opacity:.4;cursor:default;}
.actionbar{background:var(--bg);border-top:1px solid var(--border);}
.actionbar .inner{max-width:960px;margin:0 auto;height:80px;padding:0 24px;display:flex;align-items:center;justify-content:flex-end;}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="inner">
      <span class="back">← 返回</span>
      <span class="ttl">我在南昌的童年</span>
      <span class="status"><span class="dot"></span>服务：正常</span>
    </div>
  </header>

  <main class="content">
    <div class="infobar">
      <span class="k">当前记录</span><span class="v">我在南昌的童年</span>
      <span class="sep"></span>
      <span class="k">已录片段</span><span class="v">2 段</span>
      <span class="sep"></span>
      <span class="k">累计时长</span><span class="v">04:35</span>
    </div>

    <h2>已录片段</h2>
    <div class="seg">
      <span class="n">片段 1</span>
      <span class="dur">03:15</span>
      <span class="tag">已确认</span>
      <span class="sp">
        <button class="btn btn-secondary">播放</button>
        <button class="btn btn-text">重新录制</button>
        <button class="btn btn-text" style="color:var(--danger)">删除</button>
      </span>
    </div>
    <div class="seg">
      <span class="n">片段 2</span>
      <span class="dur">01:20</span>
      <span class="tag">已确认</span>
      <span class="sp">
        <button class="btn btn-secondary">播放</button>
        <button class="btn btn-text">重新录制</button>
        <button class="btn btn-text" style="color:var(--danger)">删除</button>
      </span>
    </div>

    <div class="recwrap">
      <button class="recbtn"><i></i></button>
      <div class="recstate">正在录音 · 00:42</div>
      <div class="rectime">00:42</div>
      <div class="recsub">请用平时说话的速度讲述，不必刻意组织语言</div>
      <div class="secrow">
        <button class="btn btn-secondary">暂停</button>
        <button class="btn btn-secondary">结束本段</button>
        <button class="btn btn-secondary" disabled>播放</button>
        <button class="btn btn-text">重新录制</button>
      </div>
    </div>

    <div class="upload">
      <a href="#">上传音频（备用入口）</a>
      <p>仅在无法现场录音时使用</p>
    </div>
  </main>

  <footer class="actionbar">
    <div class="inner">
      <button class="btn btn-primary" disabled>确认录音</button>
    </div>
  </footer>
</div>
</body>
</html>
