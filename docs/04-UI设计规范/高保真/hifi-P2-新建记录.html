<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>高保真 P2 新建记录 · myMemory</title>
<style>
:root{
  --primary:#96604B; --primary-hover:#8A5A45; --primary-active:#7A4B3B;
  --primary-soft:#E8D5C6; --accent:#B4785A;
  --text:#3D332C; --muted:#6E5F54; --border:#E3D8CC;
  --bg:#FDFAF5; --bg-subtle:#F7F1E8; --bg-hover:#EFE4D6;
  --link:#8A5A45; --link-hover:#7A4E3C;
  --success:#7D8C4F; --warning:#B07C22; --danger:#A85A4D;
  --ok-bg:#E7EBD9; --ok-fg:#4F5C2C;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --shadow:0 1px 2px rgba(61,51,44,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-subtle); color:var(--text);
  font-family:-apple-system,"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:18px; line-height:1.8; -webkit-font-smoothing:antialiased;
}
.shell{min-height:960px;display:flex;flex-direction:column;}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);}
.topbar .inner{max-width:960px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:16px;}
.back{font-size:16px;color:var(--link);cursor:pointer;}
.ttl{font-size:18px;font-weight:600;}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:16px;color:var(--muted);
  border:1px solid var(--border);background:var(--bg-subtle);border-radius:999px;padding:4px 14px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
.content{flex:1;max-width:960px;width:100%;margin:0 auto;padding:32px 24px;}
h1{font-size:32px;line-height:1.4;font-weight:700;margin:0 0 8px;}
.lead{font-size:16px;color:var(--muted);margin:0 0 40px;}
.field{max-width:632px;}
.field label{display:block;font-size:16px;font-weight:500;margin-bottom:8px;}
.input{
  height:56px;border:1px solid var(--primary);border-radius:var(--r-sm);background:var(--bg);
  display:flex;align-items:center;padding:0 16px;font-size:18px;color:var(--text);
  box-shadow:0 0 0 2px rgba(150,96,75,.18);
}
.input .caret{display:inline-block;width:2px;height:22px;background:var(--primary);margin-left:2px;vertical-align:-4px;}
.hint{display:flex;justify-content:space-between;font-size:16px;color:var(--muted);margin-top:10px;}
.tips{margin-top:44px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);
  padding:24px;box-shadow:var(--shadow);max-width:632px;}
.tips h2{font-size:20px;font-weight:600;margin:0 0 12px;}
.tips ul{margin:0;padding-left:24px;}
.tips li{font-size:16px;color:var(--muted);margin:6px 0;}
.tips li strong{color:var(--text);}
.btn{font-family:inherit;border-radius:var(--r-md);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;white-space:nowrap;}
.btn-primary{height:56px;padding:0 32px;background:var(--primary);color:var(--bg);border:none;font-size:18px;font-weight:600;}
.actionbar{background:var(--bg);border-top:1px solid var(--border);}
.actionbar .inner{max-width:960px;margin:0 auto;height:80px;padding:0 24px;display:flex;align-items:center;justify-content:flex-end;}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="inner">
      <span class="back">← 返回</span>
      <span class="ttl">新建记录</span>
      <span class="status"><span class="dot"></span>服务：正常</span>
    </div>
  </header>

  <main class="content">
    <h1>新建口述记录</h1>
    <p class="lead">先给这段回忆起个名字，接下来就可以开始录音了。</p>

    <div class="field">
      <label for="title">记录标题</label>
      <div class="input" id="title">我在南昌的童年<span class="caret"></span></div>
      <div class="hint"><span>标题仅用于你自己区分记录，之后可以随时修改。</span><span>7 / 40</span></div>
    </div>

    <div class="tips">
      <h2>开始之前</h2>
      <ul>
        <li>录音会保存在<strong>本机浏览器</strong>中，不会自动上传到任何服务器。</li>
        <li>可以<strong>分多次录制</strong>同一段回忆，系统会把它们归在同一条记录下。</li>
        <li>一次说三五分钟即可，不必刻意组织语言，想到哪里说到哪里。</li>
      </ul>
    </div>
  </main>

  <footer class="actionbar">
    <div class="inner">
      <button class="btn btn-primary">开始录音</button>
    </div>
  </footer>
</div>
</body>
</html>
